version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medikiosk:medikiosk_secret@postgres:5432/medikiosk_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=llama3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=medikiosk-documents
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-DEMO_BHASHINI_KEY}
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-DEMO_USER_ID}
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk_secret
      POSTGRES_DB: medikiosk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  ollama_data:
  minio_data:
